name: pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

env:
  OPENAI_MODEL: gpt-4o-mini
  OPENAI_MAX_TOKENS: "800"

jobs:
  gather:
    name: Gather changed files (chunk <= 10)
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.build_chunks.outputs.chunks }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build chunks
        id: build_chunks
        shell: bash
        run: |
          set -euo pipefail

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          # 仅收集前端代码文件；排除生成目录/文档
          git diff --name-only "$BASE" "$HEAD" -- \
            ':(exclude)**/node_modules/**' \
            ':(exclude)**/dist/**' \
            ':(exclude)**/build/**' \
            ':(exclude)**/*.md' \
            '**/*.ts' '**/*.tsx' '**/*.js' '**/*.jsx' \
          | sed '/^\s*$/d' > changed.txt

          echo "Changed files:"
          cat changed.txt || true

          # 用 jq 把文件按 10 个一组切片，输出 JSON 数组
          jq -R -s 'split("\n") | map(select(length>0)) |
            [ range(0; length; 10) as $i | (.[ $i : ($i+10) ] | join(",")) ]' < changed.txt > batches.json

          echo "chunks=$(cat batches.json)" >> "$GITHUB_OUTPUT"

  review:
    name: ChatGPT code review (batched)
    needs: gather
    runs-on: ubuntu-latest
    if: ${{ needs.gather.outputs.chunks != '' && needs.gather.outputs.chunks != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        files_batch: ${{ fromJSON(needs.gather.outputs.chunks) }}

    steps:
      - name: Run ChatGPT PR review (≤ 10 files)
        if: ${{ secrets.OPENAI_API_KEY != '' }}
        uses: agogear/chatgpt-pr-review@0.0.17
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          openai_model: ${{ env.OPENAI_MODEL }}
          openai_max_tokens: ${{ env.OPENAI_MAX_TOKENS }}

          # 当前批次（逗号分隔，数量 ≤ 10）
          files: ${{ matrix.files_batch }}

          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_pr_id: ${{ github.event.number }}

      - name: Skip (no OPENAI_API_KEY)
        if: ${{ secrets.OPENAI_API_KEY == '' }}
        run: echo "No OPENAI_API_KEY provided; skipping AI review for this batch."
