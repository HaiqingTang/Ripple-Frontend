name: pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened]   # PR 创建/推送新提交/重新打开时触发
  # （可选）如果你也想在 push 到某些分支时自测，取消以下注释
  # push:
  #   branches: [ backend-meetup ]           # 或 main / develop 等

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    name: AI PR Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 没配密钥就跳过，避免失败（可保留）
      - name: Skip when no OPENAI_API_KEY
        if: ${{ secrets.OPENAI_API_KEY == '' }}
        run: echo "No OPENAI_API_KEY set; skipping ChatGPT review."

      # 选一个维护比较活跃的审查 Action（推荐）
      - name: ChatGPT review
        if: ${{ secrets.OPENAI_API_KEY != '' }}
        uses: ruilisi/auto-pr-review@v1.0.7
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: gpt-4o-mini             # 换成你账号可用的模型
          path_filters: |
            **/*.js
            **/*.ts
            **/*.tsx
            **/*.py
            **/*.cpp
            **/*.java
          review_simple_changes: true
          review_comment_lgtm: false