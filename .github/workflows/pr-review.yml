name: pr-review
on:
 pull_request:
   types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    name: ChatGPT code review
    runs-on: ubuntu-latest
    steps:
      - uses: agogear/chatgpt-pr-review@0.0.17
        with:
          openai_max_tokens: 8192
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_pr_id: ${{ github.event.number }}
          files: "src/frontend/components/ProfilePicture.tsx, src/frontend/components/ImagePickerModal.tsx, src/frontend/lib/imageService.ts, src/frontend/app/profile/edit.tsx, src/frontend/context/AppContext.tsx"
          openai_model: gpt-5-mini
          logging: debug

          # files: "*.js, *.tsx, *.py, *.cpp, *.java"