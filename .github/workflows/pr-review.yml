name: pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI PR Review
    runs-on: ubuntu-latest

    # 如果没有配置 OPENAI_API_KEY，就整个 job 跳过（注意 ${{ }} 必须有）
    if: ${{ secrets.OPENAI_API_KEY != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: ChatGPT review
        uses: ruilisi/auto-pr-review@v1.0.7
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: gpt-4o-mini           # 换成你账号可用的模型
          path_filters: |
            **/*.js
            **/*.ts
            **/*.tsx
            **/*.py
            **/*.cpp
            **/*.java
          review_simple_changes: true
          review_comment_lgtm: false