name: pr-review
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    name: AI Code Review (Space)
    runs-on: ubuntu-latest
    env:
      # ⚠️ 你的 Space 访问地址（username-spacename.hf.space）
      SPACE_URL: https://haiqing19-pr-review.hf.space
      # 为了控制 payload 体积，这里做一次轻裁剪；Space 内还有分片保护
      MAX_CHARS: "48000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ping Space /health
        run: |
          set -e
          echo "Pinging $SPACE_URL/health ..."
          curl -sS "$SPACE_URL/health"

      - name: Get PR diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          git diff --unified=3 origin/${{ github.event.pull_request.base.ref }}...HEAD > pr.diff
          head -c "$MAX_CHARS" pr.diff > pr_trimmed.diff
          echo "::group::Diff sizes"
          wc -c pr.diff pr_trimmed.diff || true
          echo "::endgroup::"

      - name: Call Space /review
        run: |
          jq -n --rawfile d pr_trimmed.diff '{diff:$d}' > payload.json
          echo "::group::Calling Space"
          http_code=$(curl -sS -w "%{http_code}" -o response.json \
            -X POST "$SPACE_URL/review" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json || echo "000")
          echo "HTTP $http_code"
          echo "::endgroup::"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Space returned HTTP $http_code"
            echo "Response:"
            cat response.json || true
            # 兜底，避免整条流水线失败，可按需改为 `exit 1`
            echo "⚠️ Space error ($http_code). See logs below.\n\n\`\`\`json" > review.md
            cat response.json >> review.md || true
            echo "\n\`\`\`" >> review.md
          else
            jq -r '.review // "⚠️ Space returned no review."' response.json > review.md
          fi

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review.md','utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "🧠 **AI Review (Space)**\n\n" + body
            });

