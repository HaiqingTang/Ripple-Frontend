name: pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI PR Review (OpenAI direct)
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4o-mini   # 换成你账号可用的模型：如 gpt-4o
      DIFF_LIMIT: "60000"         # 最大 diff 字符数，防止超长

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure API key exists
        if: ${{ env.OPENAI_API_KEY == '' || env.OPENAI_API_KEY == null }}
        run: |
          echo "No OPENAI_API_KEY set; skipping ChatGPT review."
          exit 0

      - name: Build diff
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "Base: $BASE_SHA"
          echo "Head: $HEAD_SHA"

          git --no-pager diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- \
            ':(exclude)**/node_modules/**' \
            ':(exclude)**/dist/**' \
            ':(exclude)**/build/**' \
            '**/*.js' '**/*.jsx' '**/*.ts' '**/*.tsx' \
            '**/*.py' '**/*.cpp' '**/*.java' \
            '**/*.json' '**/*.yaml' '**/*.yml' \
            > full.diff || true

          head -c "$DIFF_LIMIT" full.diff > pr.diff || true
          DIFF_SIZE="$(wc -c < pr.diff || echo 0)"
          echo "diff_size=$DIFF_SIZE" >> "$GITHUB_OUTPUT"
          echo "Collected diff bytes: $DIFF_SIZE"

      - name: Skip when no relevant changes
        if: ${{ steps.diff.outputs.diff_size == '0' }}
        run: echo "No relevant code changes. Skipping review."

      - name: Prepare prompt & call OpenAI
        if: ${{ steps.diff.outputs.diff_size != '0' }}
        id: ai
        shell: bash
        run: |
          set -euo pipefail

          # ---- system prompt（heredoc 必须顶格，不要缩进）----
          cat > system.txt <<'SYS'
  You are a senior full-stack engineer reviewing a GitHub Pull Request diff.
Stack: Expo + React Native (expo-router), TypeScript.
Focus areas:
  - Navigation correctness (expo-router paths, _layout.tsx)
  - UI layout stability (fixed sizes for grids/lists, sticky header on clubTopic)
  - Separation of mock vs. real API, no real network calls without backend
  - Infinite scroll & pull-to-refresh logic; error/empty/loading states
  - Accessibility (accessibilityRole, hitSlop), performance, code reuse
  Return a prioritized checklist with concrete, actionable suggestions and small code snippets when useful.
  SYS

# ---- user prompt，包一段 diff ----
  {
    echo "Please review the following PR diff. Identify issues, risks, and concrete improvements. Provide a prioritized checklist and code examples where appropriate."
    echo
    echo '```diff'
    cat pr.diff
    echo '```'
  } > user.txt
  
  # ---- 组装 JSON ----
  jq -n \
    --arg model "$OPENAI_MODEL" \
    --rawfile sys system.txt \
    --rawfile usr user.txt \
    '{
      model: $model,
      temperature: 0.2,
      messages: [
        {role:"system", content: $sys},
        {role:"user",   content: $usr}
      ]
    }' > payload.json
  
  # ---- 调 OpenAI ----
  curl -sS https://api.openai.com/v1/chat/completions \
    -H "Authorization: Bearer ${OPENAI_API_KEY}" \
    -H "Content-Type: application/json" \
    -d @payload.json \
    | jq -r '.choices[0].message.content // "No content returned from OpenAI."' \
    > review.md
  
  echo "Preview (first 40 lines):"
  head -n 40 review.md || true
  
  - name: Post PR comment
  if: ${{ steps.diff.outputs.diff_size != '0' }}
  uses: actions/github-script@v7
  with:
  script: |
    const fs = require('fs');
    const body = fs.readFileSync('review.md', 'utf8');
    await github.rest.issues.createComment({
      owner: context.repo.owner,
      repo: context.repo.repo,
      issue_number: context.issue.number,
      body,
    });
