name: pr-review
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  gather:
    name: Gather changed files (chunk <= 10)
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.build_chunks.outputs.chunks }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build chunks
        id: build_chunks
        shell: bash
        run: |
          set -euo pipefail

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          # 取本次 PR 改动文件
          git diff --name-only "$BASE" "$HEAD" > all.txt

          # 仅保留与你原来 files 入参一致的后缀（*.js, *ts, *.py, *.cpp, *.java）
          # 注意：保持原语义，这里只匹配 .ts（不额外加入 .tsx）
          grep -E '\.(js|ts|py|cpp|java)$' all.txt | sed '/^\s*$/d' > changed.txt || true

          # 分批（每批最多10个），输出为 JSON 数组到 $GITHUB_OUTPUT
          mapfile -t FILES < <(cat changed.txt 2>/dev/null || true)

          CHUNKS_JSON="[]"
          if [ "${#FILES[@]}" -gt 0 ]; then
            BATCHES=()
            COUNT=0
            BATCH=""
            for f in "${FILES[@]}"; do
              if [ -z "$BATCH" ]; then
                BATCH="$f"
              else
                BATCH="$BATCH,$f"
              fi
              COUNT=$((COUNT+1))
              if [ "$COUNT" -eq 10 ]; then
                BATCHES+=("$BATCH")
                BATCH=""
                COUNT=0
              fi
            done
            if [ -n "$BATCH" ]; then
              BATCHES+=("$BATCH")
            fi
            # 组装 JSON 数组
            CHUNKS_JSON=$(printf '%s\n' "${BATCHES[@]}" | jq -R . | jq -s .)
          fi

          echo "chunks=${CHUNKS_JSON}" >> "$GITHUB_OUTPUT"

  review:
    name: ChatGPT code review
    needs: gather
    runs-on: ubuntu-latest
    if: ${{ needs.gather.outputs.chunks != '' && needs.gather.outputs.chunks != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        files_batch: ${{ fromJSON(needs.gather.outputs.chunks) }}
    steps:
      - name: Run ChatGPT PR review (≤ 10 files)
        uses: agogear/chatgpt-pr-review@0.0.17
        with:
          openai_max_tokens: 8192
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_pr_id: ${{ github.event.number }}
          # 这里传入每批文件（逗号分隔，数量 ≤ 10），替代原来的通配符
          files: ${{ matrix.files_batch }}
          openai_model: gpt-5-mini
