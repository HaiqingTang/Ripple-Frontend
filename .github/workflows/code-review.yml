name: 'code-review'
on: # rebuild any PRs and main branch changes
  pull_request:
jobs:
  code-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v3
      - uses: necojackarc/auto-request-review@v0.13.0
        env:
          NODE_OPTIONS: '--experimental-fetch'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
